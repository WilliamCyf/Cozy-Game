<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cozy Cove</title>
<meta name="description" content="A cozy island game for the whole family. Fish, garden and fix up the island together — up to 4 players.">
<meta name="theme-color" content="#2fc6c8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cozy Cove">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<!--%SPLASH%-->
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>/*%CSS%*/</style>
</head>
<body>
<div id="app">
  <canvas id="gl" aria-label="Cozy Cove game world"></canvas>
  <div id="ui"></div>
  <div id="boot" class="boot">
    <div class="boot-inner">
      <div class="boot-logo"><span class="boot-sun"></span><span class="boot-wave"></span></div>
      <div class="boot-title">Cozy Cove</div>
      <div class="boot-bar"><i id="boot-fill"></i></div>
      <div class="boot-msg" id="boot-msg">Packing the picnic basket…</div>
    </div>
  </div>
  <script>/* Thai phone? show the loading message in Thai (same choice as src/i18n/i18n.js) */(function(){try{var l=new URLSearchParams(location.search).get('lang')||JSON.parse(localStorage.getItem('cozycove.settings')||'{}').lang||((navigator.languages||[]).concat(navigator.language||'').some(function(x){return /^th\b/i.test(x)})?'th':'en');if(l==='th'){document.documentElement.lang='th';document.getElementById('boot-msg').textContent='กำลังจัดตะกร้าปิกนิก…'}}catch(e){}})()</script>
</div>
<noscript>Cozy Cove needs JavaScript turned on.<br>ต้องเปิด JavaScript ก่อนนะ ถึงจะเล่นเกมนี้ได้</noscript>
<script>
/* If the game file can't load (e.g. a leftover old page pointing at a file that was replaced),
   try once more by itself, then offer a button. Written in both languages. */
function __bootFail(){try{if(!sessionStorage.getItem('cozycove.bootRetry')){sessionStorage.setItem('cozycove.bootRetry','1');location.reload();return}}catch(e){}
var m=document.getElementById('boot-msg');if(m){m.innerHTML='Couldn\u2019t load the game · โหลดเกมไม่ได้<br><button type="button" class="boot-retry" onclick="location.reload()">Tap to try again · แตะเพื่อลองใหม่</button>'}}
setTimeout(function(){var b=document.getElementById('boot');if(b&&!b.classList.contains('hide')&&!window.__booted)__bootFail()},30000);
</script>
<script type="module" src="%APP%" onerror="__bootFail()"></script>
</body>
</html>
